services:
  - type: web
    name: customer-feedback-ai-response-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 600
    envVars:
      - key: REVIEWS_CSV_PATH
        value: /tmp/Reviews.csv
      - key: REVIEWS_CSV_URL
        value: https://github.com/Smriti-pal/Customer-Feedback-AI-Response-Studio/releases/download/reviews-data-v1/Reviews.csv
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
