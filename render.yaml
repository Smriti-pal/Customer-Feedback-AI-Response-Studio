services:
  - type: web
    name: customer-feedback-ai-response-studio
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 600
    disk:
      name: reviews-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: REVIEWS_CSV_PATH
        value: /var/data/Reviews.csv
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
